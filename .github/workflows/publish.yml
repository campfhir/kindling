name: Publish

# Stages every workspace package whose package.json version is not on npm yet. Each package is
# verified (lint, typecheck, test, build, smoke test) and staged in its own job, so one package's
# failure never blocks another. A maintainer then approves the staged version with 2FA. A version
# that is already staged and waiting for approval is skipped (.github/scripts/staged.mjs).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Find package versions that are not on npm yet
        id: plan
        run: node .github/scripts/unpublished.mjs >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: publish ${{ matrix.name }}@${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; staged publishing needs >= 11.15.0
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      # unpublished.mjs only sees live versions; a version staged by an earlier run and still
      # waiting for approval would be staged again, which npm refuses (E409). "unknown" (the stages
      # could not be listed) stages as before.
      - name: Is ${{ matrix.name }}@${{ matrix.version }} already staged?
        id: staged
        run: node .github/scripts/staged.mjs "${{ matrix.name }}" "${{ matrix.version }}" >> "$GITHUB_OUTPUT"

      - name: Already staged
        if: steps.staged.outputs.staged == 'true'
        run: echo "::notice title=${{ matrix.name }}@${{ matrix.version }}::Already staged on npm and waiting for approval (npm stage approve <stage-id>, or the Staged Packages tab on npmjs.com); not staged again."

      - name: Verify ${{ matrix.name }}
        if: steps.staged.outputs.staged != 'true'
        run: |
          pnpm exec eslint "packages/${{ matrix.folder }}"
          pnpm --filter "${{ matrix.name }}" typecheck
          pnpm --filter "${{ matrix.name }}" run --if-present fixtures:fetch
          pnpm --filter "${{ matrix.name }}" test
          pnpm --filter "${{ matrix.name }}" build
          node .github/scripts/smoke-test.mjs "${{ matrix.folder }}"

      - name: Stage ${{ matrix.name }}@${{ matrix.version }} on npm
        if: steps.staged.outputs.staged != 'true'
        working-directory: packages/${{ matrix.folder }}
        # Authenticates via OIDC: the package's npm trusted publisher must point at this
        # repository (campfhir/kindling) and workflow file (publish.yml). The version only goes
        # live after a maintainer approves it with 2FA: `npm stage approve <stage-id>` or the
        # Staged Packages tab on npmjs.com. Needs npm >= 11.15.0.
        run: npm stage publish
