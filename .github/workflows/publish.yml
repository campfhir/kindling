name: Publish

# Stages every workspace package whose package.json version is not on npm yet. Each package is
# verified (lint, typecheck, test, build, smoke test) and staged in its own job, so one package's
# failure never blocks another. A maintainer then approves the staged version with 2FA. A version
# that is already staged and waiting for approval is reported with a notice, not as a failure.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Find package versions that are not on npm yet
        id: plan
        run: node .github/scripts/unpublished.mjs >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: publish ${{ matrix.name }}@${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; staged publishing needs >= 11.15.0
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      - name: Verify ${{ matrix.name }}
        run: |
          pnpm exec eslint "packages/${{ matrix.folder }}"
          pnpm --filter "${{ matrix.name }}" typecheck
          pnpm --filter "${{ matrix.name }}" run --if-present fixtures:fetch
          pnpm --filter "${{ matrix.name }}" test
          pnpm --filter "${{ matrix.name }}" build
          node .github/scripts/smoke-test.mjs "${{ matrix.folder }}"

      - name: Stage ${{ matrix.name }}@${{ matrix.version }} on npm
        working-directory: packages/${{ matrix.folder }}
        # Authenticates via OIDC: the package's npm trusted publisher must point at this
        # repository (campfhir/kindling) and workflow file (publish.yml). The version only goes
        # live after a maintainer approves it with 2FA: `npm stage approve <stage-id>` or the
        # Staged Packages tab on npmjs.com. Needs npm >= 11.15.0.
        #
        # unpublished.mjs only sees live versions, so a version staged by an earlier run and still
        # waiting for approval is staged again here, and npm refuses with E409 "Cannot stage
        # previously published version". As the version is not live (unpublished.mjs checked), that
        # error means it is already staged: report it with a notice and succeed. Every other error
        # fails the job. (The token trusted publishing exchanges cannot list stages, so the job cannot
        # ask beforehand: GET /-/stage answers 401 to it.)
        run: |
          set +e
          npm stage publish 2>&1 | tee "$RUNNER_TEMP/stage.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && grep -q 'Cannot stage previously published version' "$RUNNER_TEMP/stage.log"; then
            echo "::notice title=${{ matrix.name }}@${{ matrix.version }}::Already staged on npm and waiting for approval (npm stage approve <stage-id>, or the Staged Packages tab on npmjs.com); not staged again."
            exit 0
          fi
          exit "$status"
